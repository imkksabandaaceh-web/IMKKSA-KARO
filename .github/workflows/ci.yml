name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Jalur pendaftaran /daftar wajib INSERT murni (RLS anon hanya punya policy
      # INSERT dengan is_pending = true). Cek ini juga jalan otomatis lewat
      # `npm run prebuild`, sehingga build Vercel ikut gagal bila kontrak rusak.
      - name: Cek kontrak RLS jalur /daftar (blocking)
        run: npm run check:rls

      - name: Lint (advisory)
        run: npm run lint || echo "⚠️ Lint warnings found (non-blocking)"
        continue-on-error: true

      - name: Type check & Build
        run: npm run build
